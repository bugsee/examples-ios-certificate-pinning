# Destination: every repo  →  .github/workflows/bugseeai.yml
# Thin caller; all logic lives in bugsee/control-repo.
name: bugseeai

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

permissions:
  contents: read
  actions: read

jobs:
  bugseeai:
    uses: bugsee/control-repo/.github/workflows/bugseeai.yml@main
    secrets: inherit
    # Optional per-repo overrides:
    # with:
    #   allowed_tools: "Bash(cargo build:*),Bash(cargo test:*)"
    #   trusted_authors_only: true
